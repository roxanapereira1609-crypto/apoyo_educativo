
# Nombre del proyecto
spring.application.name=apoyo_educativo

# Actualizar las plantillas sin utilizar cache
spring.thymeleaf.cache=false

# Base de datos H2 guardada en un archivo
spring.datasource.url=jdbc:h2:file:./data/apoyo_educativo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pagina de error personalizada
server.error.whitelabel.enabled=false
