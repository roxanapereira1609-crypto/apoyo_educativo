
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Gestión de Actividades</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(64, 143, 211, 0.32), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(132, 95, 199, 0.25), transparent 35%),
                linear-gradient(135deg, #09152c, #142a4c, #101c38);
            color: #172b4d;
        }

        .contenedor {
            width: 100%;
            max-width: 440px;
            padding: 48px 40px;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.28);
        }

        h1 {
            margin: 0 0 14px;
            text-align: center;
            font-size: 29px;
            color: #173b68;
            letter-spacing: -0.5px;
        }

        .descripcion {
            margin: 0 0 35px;
            color: #748197;
            text-align: center;
            font-size: 14px;
            line-height: 1.7;
        }

        h2 {
            margin: 0 0 28px;
            font-size: 20px;
            text-align: center;
            color: #243b53;
        }

        .campo {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #34435a;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 15px 16px;
            border: 1px solid #dce3ed;
            border-radius: 11px;
            background: #f8fafc;
            color: #172b4d;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #4786bd;
            box-shadow: 0 0 0 4px rgba(71, 134, 189, 0.12);
            background: white;
        }

        .boton {
            width: 100%;
            margin-top: 8px;
            padding: 16px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(110deg, #173b68, #286ba0);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .boton:hover {
            transform: translateY(-2px);
            box-shadow: 0 9px 22px rgba(23, 59, 104, 0.2);
        }

        .boton:focus-visible {
            outline: 3px solid #80b8e9;
            outline-offset: 3px;
        }

        .mensaje {
            padding: 13px;
            margin-bottom: 22px;
            border-radius: 10px;
            text-align: center;
            font-size: 13px;
            line-height: 1.5;
        }

        .error {
            background: #fff0f0;
            color: #a52a2a;
            border: 1px solid #f5d2d2;
        }

        .exito {
            background: #eaf8ef;
            color: #276c42;
            border: 1px solid #ccebd7;
        }

        .pie {
            margin: 30px 0 0;
            text-align: center;
            color: #95a0af;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .contenedor {
                padding: 38px 25px;
            }

            h1 {
                font-size: 26px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            input,
            .boton {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>Apoyo Educativo</h1>

        <p class="descripcion">
           <h2>Un espacio diseñado para gestionar actividades planificadas</h2> 
        </p>
        <div th:if="${param.error}" class="mensaje error" role="alert">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.salio}" class="mensaje exito" role="status">
            Has cerrado sesión correctamente.
        </div>

       <form th:action="@{/login-actividades}" method="post">

    <div class="campo">
        <label for="username">Nombre de usuario</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            required>
    </div>

    <div class="campo">
        <label for="password">Contraseña</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required>
    </div>

    <button type="submit" class="boton">
        Iniciar sesión
    </button>

</form>

        <p class="pie">
            Acceso exclusivo para personal autorizado.
        </p>

    </main>

</body>
</html>
