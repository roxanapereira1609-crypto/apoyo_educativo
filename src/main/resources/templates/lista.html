
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Control de Asistencia - Apoyo Educativo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #243b53;
        }

        .subtitulo {
            text-align: center;
            color: #627d98;
        }

        .resumen {
            background-color: #e8f1ff;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: #243b53;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f5f8fc;
        }

        .boton {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 15px;
        }

        .acciones {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .boton-editar {
            background-color: #e9a23b;
            color: #202020;
            padding: 8px 12px;
            border-radius: 5px;
            text-decoration: none;
        }

        .boton-editar:hover {
            background-color: #d68b22;
        }

        .boton-eliminar {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .boton-eliminar:hover {
            background-color: #b02a37;
        }

        .acciones form {
            margin: 0;
        }

        .mensaje {
            text-align: center;
            padding: 20px;
            color: #627d98;
        }

        @media (max-width: 700px) {
            .contenedor {
                overflow-x: auto;
            }

            table {
                min-width: 750px;
            }
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Control de Asistencia Docente</h1>

        <p class="subtitulo">
            Sistema de Apoyo Educativo
        </p>

        <div class="resumen">
            <strong>Total de asistencias registradas:</strong>
            <span th:text="${total}">0</span>
        </div>

        <a th:href="@{/asistencias/nuevo}" class="boton">
            + Registrar nueva asistencia
        </a>

        <table>
            <thead>
                <tr>
                    <th>Docente</th>
                    <th>Fecha</th>
                    <th>Hora de ingreso</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="asistencia : ${asistencias}">

                    <td th:text="${asistencia.nombreDocente}">
                        Nombre del docente
                    </td>

                    <td th:text="${asistencia.fecha}">
                        Fecha
                    </td>

                    <td th:text="${asistencia.horaIngreso}">
                        Hora
                    </td>

                    <td th:text="${asistencia.estado}">
                        Estado
                    </td>

                    <td>
                        <div class="acciones">

                            <a class="boton-editar"
                               th:href="@{/asistencias/editar/{id}(id=${asistencia.id})}">
                                Editar
                            </a>

                            <form
                                th:action="@{/asistencias/eliminar/{id}(id=${asistencia.id})}"
                                method="post"
                                onsubmit="return confirm('¿Estás seguro de que deseas eliminar esta asistencia?');">

                                <button type="submit" class="boton-eliminar">
                                    Eliminar
                                </button>

                            </form>

                        </div>
                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(asistencias)}">
                    <td colspan="5" class="mensaje">
                        Todavía no hay asistencias registradas.
                    </td>
                </tr>

            </tbody>
        </table>

    </div>

</body>
</html>
